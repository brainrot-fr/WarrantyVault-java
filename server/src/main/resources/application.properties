spring.profiles.default=local
spring.datasource.url=jdbc:h2:file:./data/warrantyvault;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=sa
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.mvc.async.request-timeout=30000
logging.level.root=INFO
server.port=${PORT:8080}
app.expiring-soon-days=30
app.storage.local-dir=./uploads
app.jwt-secret=${JWT_SECRET:dev-secret-key-1234567890-abcdef}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.cookie.same-site=${COOKIE_SAMESITE:Lax}
app.cookie.domain=${COOKIE_DOMAIN:}
app.max-upload-bytes=10485760
