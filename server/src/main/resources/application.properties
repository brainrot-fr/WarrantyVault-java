spring.datasource.url=jdbc:mysql://127.0.0.1:3306/warrantyvault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:warrantyvault}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.mvc.async.request-timeout=30000
logging.level.root=INFO
server.address=127.0.0.1
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
app.expiring-soon-days=30
app.storage.local-dir=./uploads
app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.jwt-secret=${APP_JWT_SECRET:}
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=Lax
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}
app.seed-demo-password=${APP_DEMO_PASSWORD:}
app.max-upload-bytes=10485760
