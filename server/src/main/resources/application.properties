spring.datasource.url=jdbc:mysql://127.0.0.1:3306/warrantyvault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:warrantyvault}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.mvc.async.request-timeout=30000
logging.level.root=INFO
server.address=127.0.0.1
server.port=8080
app.expiring-soon-days=30
app.storage.local-dir=./uploads
app.jwt-secret=local-only-secret-key-for-warrantyvault-mvp
app.max-upload-bytes=10485760
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false
