spring.datasource.url=${DB_URL:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
app.storage.local-dir=${APP_STORAGE_LOCAL_DIR:/app/uploads}
app.jwt-secret=${JWT_SECRET:}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cookie.same-site=${COOKIE_SAMESITE:Lax}
app.cookie.domain=${COOKIE_DOMAIN:}
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=${COOKIE_SAMESITE:Lax}
server.servlet.session.cookie.domain=${COOKIE_DOMAIN:}
