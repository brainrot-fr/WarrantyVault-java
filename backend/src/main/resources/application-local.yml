spring:
  datasource:
    url: jdbc:h2:file:./data/warrantyvault;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/migration
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
app:
  storage:
    local-dir: ./uploads
  reminders:
    internal-scheduler-enabled: true
server:
  servlet:
    session:
      cookie:
        same-site: Lax
        secure: false
