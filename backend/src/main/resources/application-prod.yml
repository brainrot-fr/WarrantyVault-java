spring:
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jpa:
    show-sql: false
app:
  storage:
    local-dir: ./uploads
  reminders:
    internal-scheduler-enabled: false
server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: ${COOKIE_SAMESITE:Lax}
        domain: ${COOKIE_DOMAIN:}
