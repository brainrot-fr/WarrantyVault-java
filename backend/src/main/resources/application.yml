spring:
  profiles:
    default: local
  datasource:
    url: jdbc:h2:file:./data/warrantyvault;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties: {}
  flyway:
    enabled: true
  mvc:
    async:
      request-timeout: 30000
logging:
  level:
    root: INFO
server:
  port: ${PORT:8080}
app:
  storage:
    local-dir: ./uploads
  reminders:
    internal-scheduler-enabled: true
  jwt-secret: ${JWT_SECRET:dev-secret-key-1234567890-abcdef}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  app-base-url: ${APP_BASE_URL:http://localhost:5173}
  cron-secret: ${CRON_SECRET:dev-cron-secret}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  brevo:
    api-key: ${BREVO_API_KEY:}
    sender: ${BREVO_SENDER:}
  mail:
    from: no-reply@warrantyvault.local
  cookie:
    same-site: ${COOKIE_SAMESITE:Lax}
    domain: ${COOKIE_DOMAIN:}
  max-upload-bytes: 10485760
