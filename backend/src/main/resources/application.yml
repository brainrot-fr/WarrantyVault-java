spring:
  profiles:
    default: local
  datasource:
    url: jdbc:h2:file:./data/warrantyvault;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties: {}
  flyway:
    enabled: true
  mvc:
    async:
      request-timeout: 30000
logging:
  level:
    root: INFO
server:
  port: ${PORT:8080}
app:
  expiring-soon-days: 30
  storage:
    local-dir: ./uploads
  jwt-secret: ${JWT_SECRET:dev-secret-key-1234567890-abcdef}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  cookie:
    same-site: ${COOKIE_SAMESITE:Lax}
    domain: ${COOKIE_DOMAIN:}
  max-upload-bytes: 10485760
